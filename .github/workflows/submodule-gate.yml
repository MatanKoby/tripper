name: submodule-gate

# Runs the submodule-bump verification gate (spec/agents.md) on any change to a
# vendored agent's pointer. A submodule bump shows up in the diff as a change to
# the gitlink under vendor/agents/** (and .gitmodules when a submodule is added or
# its URL changes), so those paths are the trigger. The gate compile-checks the
# submodule, runs its non-e2e tests, and runs tripper's adapter/contract tests;
# the job goes red if any of them fail, blocking the bad bump from being trusted.

on:
  push:
    paths:
      - ".gitmodules"
      - "vendor/agents/**"
      - "scripts/submodule_bump_gate.sh"
      - ".github/workflows/submodule-gate.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - "vendor/agents/**"
      - "scripts/submodule_bump_gate.sh"
      - ".github/workflows/submodule-gate.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      PYTHON: python
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tripper (dev + functions)
        # `functions` (firebase-admin/-functions) is needed even for the gate's check 3:
        # `pytest` imports every test module at collection time, and tripper.jobs/sweeper/
        # orchestrator import `firebase_admin` at module load, so collection fails without it.
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,functions]'

      - name: Install the vendored agent + its test deps (best-effort)
        # The gate runs the submodule's own tests and tripper's adapter tests, both
        # of which import the agent package. Install it from whatever build config
        # it ships. If the submodule is absent the gate step skips cleanly.
        #
        # Check 2 runs the submodule's *own* test suite, which may need test-only deps
        # the runtime install doesn't pull (the hotel agent's async tests need
        # pytest-asyncio). Those live in the submodule's PEP 735 `dev` dependency-group
        # (not a pip extra), so install that group; fall back to the known async runner
        # when this pip predates `--group`.
        run: |
          sub="vendor/agents/hotel-finder-agent"
          if [ -f "$sub/pyproject.toml" ] || [ -f "$sub/setup.py" ] || [ -f "$sub/setup.cfg" ]; then
            python -m pip install -e "$sub"
            if [ -f "$sub/pyproject.toml" ]; then
              python -m pip install --group "$sub/pyproject.toml:dev" \
                || python -m pip install pytest-asyncio
            fi
          elif [ -f "$sub/requirements.txt" ]; then
            python -m pip install -r "$sub/requirements.txt"
          else
            echo "No Python build config found under $sub; skipping agent install."
          fi

      - name: Run submodule bump gate
        run: bash scripts/submodule_bump_gate.sh --check-only
